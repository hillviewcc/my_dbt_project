# =============================================================================
#  Staging layer: model + column documentation and not_null / unique tests on
#  the typed, keyed staging tables.
# =============================================================================
models:
  - name: stg_product
    description: The stg_product model is a staging model that transforms the raw data from the lnd_product table in the dev_LANDING schema of the dev_rmis_db database. It includes columns for product identifiers, product details, and product categorization. The model also includes a hashed version of the ean_upc column for unique identification and a timestamp indicating when the data was loaded.
    columns:
      - name: ean_upc
        description: The unique identifier for each product, represented as a number. This is derived from the 'ean_upc' column in the 'lnd_product' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: product_name
        data_type: varchar
        description: The name of the product. This is derived from the 'product_name' column in the 'lnd_product' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
      - name: product_category_id
        data_type: number
        description: This is a numeric identifier for the product category. Each unique product category has a unique ID. This field is used to categorize products into broad groups.
        data_tests:
          - not_null
      - name: product_sub_category_id
        data_type: number
        description: This is a numeric identifier for the product sub-category. Each unique product sub-category has a unique ID. This field is used to further categorize products within a specific product category.
        data_tests:
          - not_null
      - name: product_department_id
        data_type: number
        description: This is a numeric identifier for the product department. Each unique product department has a unique ID. This field is used to categorize products into specific departments within the organization.
        data_tests:
          - not_null
      - name: product_gender
        data_type: varchar
        description: This column represents the gender for which the product is intended. It is a string type and can contain values like 'Male', 'Female', 'Unisex', etc.
      - name: product_colour
        data_type: varchar
        description: This column represents the color of the product. It is a string type and can contain any color name like 'Red', 'Blue', 'Green', etc.
      - name: product_size
        data_type: varchar
        description: This column represents the size of the product. It is a string type and can contain values like 'Small', 'Medium', 'Large', 'Extra Large', etc.
      - name: sustainability
        data_type: varchar
        description: This field indicates whether the product is sustainable or not. It is a string field and can contain values like 'Yes', 'No', or 'Unknown'.
      - name: product_market
        data_type: varchar
        description: This field represents the market where the product is sold. It is a string field and can contain values like 'US', 'UK', 'EU', etc.
      - name: brand_id
        data_type: number
        description: This field is a unique identifier for the brand of the product. It is a numeric field.
        data_tests:
          - not_null
      - name: brand_group_id
        data_type: number
        description: The unique identifier for the brand group to which the product belongs. This is a numeric field.
        data_tests:
          - not_null
      - name: loaded_datetime
        data_type: timestamp_tz
        description: The timestamp when the product data was loaded into the database. This is a timestamp with timezone field.
        data_tests:
          - not_null
      - name: ean_upc_key
        description: A unique key generated by hashing the 'ean_upc' column. This is used to ensure the uniqueness of each product in the 'stg_product' model.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: created_datetime
        description: The timestamp when the product record was created in the database. This is a timestamp with local timezone field.
        data_type: timestamp_ltz
        data_tests:
          - not_null
      - name: created_by
        description: The username of the user who created the record. This is automatically populated by the CURRENT_USER() function in the SQL.
        data_type: varchar
        data_tests:
          - not_null
      - name: last_updated_datetime
        description: The timestamp when the record was last updated. This is automatically populated by the CURRENT_TIMESTAMP() function in the SQL.
        data_type: timestamp_ltz
        data_tests:
          - not_null
      - name: last_updated_by
        description: The username of the user who last updated the record. This is automatically populated by the CURRENT_USER() function in the SQL.
        data_type: varchar
        data_tests:
          - not_null
  - name: stg_transaction
    description: The stg_transaction model is a staging model that transforms the raw transaction data from the lnd_transaction table in the dev_LANDING schema of the dev_rmis_db database. It includes columns for loaded timestamp, transaction id, transaction date, transaction channel, transaction store id, transaction ean upc, transaction ean upc key, transaction concat key, transaction value, transaction market, transaction quantity, transaction currency, retailer group id, retailer, last updated datetime, and last updated by. The model also includes logic to handle specific cases for the transaction channel and retailer columns.
    columns:
      - name: loaded_datetime
        description: The timestamp when the transaction data was loaded into the database. This is in the timezone of the server.
        data_type: timestamp_tz
        data_tests:
          - not_null
      - name: transaction_id
        description: A unique identifier for each transaction. This is a string value.
        data_type: varchar
        data_tests:
          - not_null
      - name: transaction_date
        description: The date when the transaction occurred. This is in the format YYYY-MM-DD.
        data_type: date
        data_tests:
          - not_null
      - name: transaction_channel
        description: This column represents the channel through which the transaction was made. It is a string type and can have values like 'Ecom' for e-commerce transactions. There is a special case where if the original value is '"Ecom""' and the retailer_group_id is '9', it is replaced with 'Ecom'.
        data_type: varchar
        data_tests:
          - not_null
      - name: transaction_store_id
        description: This column represents the unique identifier of the store where the transaction took place. It is a string type and can have various alphanumeric values representing different store locations.
        data_type: varchar
      - name: transaction_ean_upc
        description: This column represents the EAN/UPC code of the product involved in the transaction. It is a string type and can have various alphanumeric values representing different products. A unique key is also generated from this value using a hash function.
        data_type: varchar
        data_tests:
          - not_null
      - name: transaction_concat_key
        description: This is a composite key for each transaction.  It is generated by hashing the concat of EAN/UPC, transaction_value, transaction_date.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: transaction_value
        description: This represents the monetary value of the transaction. The currency of this value is specified in the TRANSACTION_CURRENCY column.
        data_type: number
        data_tests:
          - not_null
      - name: transaction_market
        description: This field indicates the market in which the transaction took place. It could be a geographical region or a specific segment of the market.
        data_type: varchar
      - name: transaction_quantity
        description: This column represents the quantity of items involved in a particular transaction. It is a numeric field.
        data_type: number
        data_tests:
          - not_null
      - name: transaction_currency
        description: This column represents the currency in which the transaction was made. It is a varchar field and typically contains standard currency codes like 'USD', 'EUR', etc.
        data_type: varchar
      - name: retailer_group_id
        description: This column represents the unique identifier for the group to which the retailer belongs. It is a numeric field.
        data_type: number
        data_tests:
          - not_null
      - name: retailer
        description: The 'RETAILER' column represents the name of the retailer. If the retailer group id is 1 and the retailer is null, the retailer is set to 'PEAKLINE'. If the retailer group id is 11 and the retailer is null, the retailer is set to 'Campforge'. In all other cases, the retailer is set to the value of the 'retailer' column in the source data.
        data_type: varchar
        data_tests:
          - not_null
      - name: last_updated_datetime
        description: The 'LAST_UPDATED_DATETIME' column represents the timestamp when the record was last updated. This is automatically set to the current timestamp when the SQL query is run.
        data_type: timestamp_ltz
        data_tests:
          - not_null
      - name: last_updated_by
        description: The 'LAST_UPDATED_BY' column represents the user who last updated the record. This is automatically set to the current user when the SQL query is run.
        data_type: varchar
  - name: stg_brand_group
    description: The stg_brand_group model is a staging table that contains information about different brand groups. It includes columns for the brand group name, brand group ID, a unique key generated from the brand group ID, and the timestamp when the data was loaded into the table. The data is sourced from the lnd_static_brand_group table in the dev_LANDING schema of the dev_rmis_db database.
    columns:
      - name: brand_group
        description: This column represents the name of the brand group. It is a string type field.
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: brand_group_id
        description: This column represents the unique identifier for each brand group. It is a numeric field.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: brand_group_key
        description: This column represents a hashed version of the brand group id. It is a numeric field and is created by applying a hash function to the brand group id.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: loaded_datetime
        description: This column represents the timestamp when the data was loaded into the stg_brand_group model. It is of timestamp_tz data type.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: stg_brand
    description: The stg_brand model is a staging table that contains information about different brands. It includes columns for brand description, brand id, brand key, single brand, and the timestamp when the data was loaded. The brand key is a unique identifier generated by hashing the brand id. The single brand column indicates whether the brand is a single brand or part of a larger brand group.
    columns:
      - name: brand_description
        description: This column contains the description of the brand. It is a string data type.
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: brand_id
        description: This column contains the unique identifier for each brand. It is a numeric data type.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: brand_key
        description: This column contains a hashed version of the brand_id for security purposes. It is a numeric data type.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: single_brand
        description: This column contains the name of the individual brand. It is a string type and is derived from the 'single_brand' column in the 'lnd_static_brand' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: varchar
        data_tests:
          - not_null
      - name: loaded_datetime
        description: This column contains the timestamp when the data was loaded into the 'stg_brand' model. It is a timestamp type and is derived from the 'loaded_timestamp' column in the 'lnd_static_brand' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: stg_department
    description: The stg_department model is a staging table that contains information about different departments in the product department. It includes columns for the product department name, department ID, a hashed department key for security purposes, and the timestamp when the data was loaded into the model. The data is sourced from the lnd_static_department table in the dev_LANDING schema of the dev_rmis_db database.
    columns:
      - name: product_department
        description: The name of the product department. This is a string field that is derived from the 'product_department' column in the 'lnd_static_department' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: department_id
        description: The unique identifier of the department. This is a numeric field that is derived from the 'department_id' column in the 'lnd_static_department' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: department_key
        description: A unique key for the department. This is a numeric field that is generated by applying a hash function to the 'department_id' column in the 'lnd_static_department' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: loaded_datetime
        description: This column represents the timestamp when the data was loaded into the stg_department model. It is of timestamp_tz data type.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: stg_product_category
    description: The stg_product_category model is a staging table that contains information about different product categories. It includes columns for the product category name, a unique identifier for each product category, a hashed key based on the product category id, and the timestamp when the data was loaded into the table. The data is sourced from the lnd_static_product_category table in the dev_LANDING schema of the dev_rmis_db database.
    columns:
      - name: product_category
        description: The name of the product category. This is a string field that is derived from the 'product_category' column in the 'lnd_static_product_category' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: product_category_id
        description: The unique identifier for the product category. This is a numeric field that is derived from the 'product_category_id' column in the 'lnd_static_product_category' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: product_category_key
        description: A unique key generated for the product category. This is a numeric field that is derived by applying a hash function to the 'product_category_id' column in the 'lnd_static_product_category' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: loaded_datetime
        description: This column represents the timestamp when the product category data was loaded into the database. It is of type timestamp_tz, which means it includes the timezone information.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: stg_product_sub_category
    description: The stg_product_sub_category model is a staging table that contains information about different product sub-categories. It includes columns for the product sub-category name, sub-category ID, a hashed key for the sub-category ID, and the timestamp when the data was loaded into the table. The data is sourced from the lnd_static_product_sub_category table in the dev_LANDING schema of the dev_rmis_db database.
    columns:
      - name: product_sub_category
        description: This column represents the name of the product sub-category.
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: sub_category_id
        description: This column represents the unique identifier for each product sub-category.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: sub_category_key
        description: This column represents a hashed key derived from the sub-category ID for additional security and privacy.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: loaded_datetime
        description: This column represents the timestamp when the data was loaded into the stg_product_sub_category model. The data type is timestamp_tz, which includes both date and time, and also accounts for time zone differences.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: stg_retailer
    description: The stg_retailer model is a staging table that contains information about retailers. It includes details such as the retailer's ID, name, group ID, group, segment, physical size, coverage, transaction mapping, and the timestamp when the data was loaded. The retailer_id is cast to a decimal type, and a hash function is applied to generate the retailer_key. The data for this model is sourced from the lnd_static_retailer table in the dev_LANDING schema of the dev_rmis_db database.
    columns:
      - name: retailer_id
        description: This is a unique identifier for each retailer. It is a numeric value that is cast to a decimal format with 38 digits to the left of the decimal point and 0 digits to the right.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: retailer_key
        description: This is a unique key for each retailer. It is generated by applying a hash function to the retailer_id. The absolute value of the hash is taken to ensure the key is always a positive number.
        data_type: number
        data_tests:
          - not_null
      - name: retailer_name
        description: This is the name of the retailer. It is a string value that is directly taken from the source data.
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: retailer_group_id
        description: The unique identifier for the retailer group. This is a varchar field that is sourced from the 'retailer_group_id' column in the 'lnd_static_retailer' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: varchar
        data_tests:
          - not_null
      - name: retailer_group
        description: The name of the retailer group. This is a varchar field that is sourced from the 'retailer_group' column in the 'lnd_static_retailer' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: varchar
        data_tests:
          - not_null
      - name: retailer_segment
        description: The segment of the retailer. This is a varchar field that is sourced from the 'retailer_segment' column in the 'lnd_static_retailer' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: varchar
      - name: retailer_size
        description: The physical size of the retailer. This is derived from the 'retailer_physical_size' column in the 'lnd_static_retailer' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: varchar
      - name: retailer_coverage
        description: The coverage area of the retailer. This is derived from the 'retailer_coverage' column in the 'lnd_static_retailer' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: varchar
      - name: transaction_mapping
        description: The mapping of the retailer's transactions. This is derived from the 'transaction_mapping' column in the 'lnd_static_retailer' table in the 'dev_LANDING' schema of the 'dev_rmis_db' database.
        data_type: varchar
        data_tests:
          - not_null
      - name: loaded_datetime
        description: This column represents the timestamp when the data was loaded into the database. It is of type timestamp_tz, which means it includes timezone information.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: stg_sales_channel
    description: The stg_sales_channel model is a transformation of the lnd_static_sales_channel source table from the dev_rmis_db.dev_LANDING schema. It uses a common table expression (CTE) to split the transaction_mapping column into multiple rows using the SPLIT_TO_TABLE function. The model then selects and transforms several columns from the CTE. The sales_channel_id is cast to a decimal and hashed to create a unique sales_channel_key. The transaction_mapping column is coalesced with 'NULL' if it contains 'NaN' and then concatenated with the sales_channel_id to create a concat_mapping_key. The sales_channel, sales_channel_group, transaction_mapping, and loaded_timestamp columns are selected as is.
    columns:
      - name: sales_channel_id
        data_type: number
        data_tests:
          - not_null
      - name: sales_mapping_key
        data_type: number
        data_tests:
          - not_null
      - name: sales_channel
        data_type: varchar
        data_tests:
          - not_null
      - name: sales_channel_group
        data_type: varchar
        data_tests:
          - not_null
      - name: transaction_mapping
        data_type: varchar
        data_tests:
          - not_null
      - name: loaded_datetime
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: stg_store
    description: The stg_store model is a staging table that contains information about various stores. It includes details such as the store's ID, key, name, postcode, postcode area, tenure, city, county, region, country, latitude, longitude, retailer group ID, retailer ID, and the timestamp when the data was loaded into the database. The data is sourced from the lnd_store table in the dev_LANDING schema of the dev_rmis_db database.
    columns:
      - name: store_id
        description: The unique identifier for each store. This is cast as a VARCHAR in the SQL query.
        data_type: varchar
      - name: store_key
        description: The key associated with each store. This is a VARCHAR field.
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: store_name
        description: The name of each store. This is a VARCHAR field.
        data_type: varchar
      - name: store_postcode
        description: The postal code of the store. This is a string field that can contain alphanumeric characters.
        data_type: varchar
      - name: store_postcode_area
        description: The area of the store as defined by the postal code. This is a string field that can contain alphanumeric characters.
        data_type: varchar
      - name: store_tenure
        description: The tenure of the store. This is a string field that can contain information about the store's lease or ownership status.
        data_type: varchar
      - name: store_city
        description: The city where the store is located. This is a string field and can contain any valid city name.
        data_type: varchar
      - name: store_county
        description: The county where the store is located. This is a string field and can contain any valid county name.
        data_type: varchar
      - name: store_region
        description: The region where the store is located. This is a string field and can contain any valid region name.
        data_type: varchar
      - name: store_country
        description: The country where the store is located. This is a string field.
        data_type: varchar
      - name: store_latitude
        description: The latitude coordinate of the store's location. This is a float field.
        data_type: float
      - name: store_longitude
        description: The longitude coordinate of the store's location. This is a float field.
        data_type: float
      - name: retailer_group_id
        description: This is a numeric identifier for the retailer group that the store belongs to. It is unique for each retailer group.
        data_type: number
      - name: retailer_id
        description: This is a numeric identifier for the retailer that the store belongs to. It is unique for each retailer.
        data_type: number
      - name: loaded_datetime
        description: This is a timestamp that indicates when the data for the store was loaded into the database. It is in the timezone of the server where the database is hosted.
        data_type: timestamp_tz
  - name: stg_fx_rates
    description: The stg_fx_rates model is a staging model that pulls data from the lnd_fx_rates table in the dev_LANDING schema of the dev_rmis_db database. The model includes columns for the timestamp when the data was loaded (LOADED_TIMESTAMP), the key for the foreign exchange date (FX_DATE_KEY), the actual foreign exchange date (FX_DATE), the foreign exchange rate (FX_RATE), a flag indicating whether the date is a weekend (IS_WEEKEND), and a flag indicating whether the rate is a Friday rate (IS_FRIDAY_RATE).
    columns:
      - name: loaded_datetime
        description: This column represents the timestamp when the foreign exchange rate data was loaded into the database. It is of type timestamp_tz.
        data_type: timestamp_tz
        data_tests:
          - not_null
      - name: fx_date_key
        description: This column is a unique identifier for each foreign exchange rate record. It is of type number.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: fx_date
        description: This column represents the date of the foreign exchange rate. It is of type date.
        data_type: date
        data_tests:
          - not_null
          - unique
      - name: is_weekend
        description: This column is a flag that indicates whether the foreign exchange rate corresponds to a weekend date. It is a string value where 'Y' indicates a weekend and 'N' indicates a weekday.
        data_type: varchar
      - name: is_friday_rate
        description: This column is a flag that indicates whether the foreign exchange rate corresponds to a Friday. It is a string value where 'Y' indicates Friday and 'N' indicates any other day of the week.
        data_type: varchar
      - name: gbp_eur
        data_type: number
        tests:
          - not_null
      - name: chf_gbp
        data_type: number
        tests:
          - not_null
      - name: usd_gbp
        data_type: number
        tests:
          - not_null
      - name: eur_gbp
        data_type: number
        tests:
          - not_null
      - name: nok_gbp
        data_type: number
        tests:
          - not_null
      - name: chf_eur
        data_type: number
        tests:
          - not_null
      - name: nok_eur
        data_type: number
        tests:
          - not_null
      - name: usd_eur
        data_type: number
        tests:
          - not_null
