# =============================================================================
#  Landing layer: model + column documentation and data tests (not_null,
#  unique, unique_case_insensitive) that guard the raw-data parsing.
# =============================================================================
models:
  - name: lnd_product
    description: The lnd_product model is a transformation of the
      RAW_DB.RETAILER.DELTA_PRODUCT_NEW source table. It contains
      information about different products offered by the retailer. The model
      includes columns for product identification (EAN_UPC), product details
      (PRODUCT_NAME, GENDER, COLOUR, SIZE, SUSTAINABILITY, MARKET), and product
      categorization (DEPARTMENT_ID, CATEGORY_ID, SUB_CATEGORY_ID, BRAND_ID,
      BRAND_GROUP_ID). The model also includes columns for record tracking
      (RECORD_HASHKEY, SOURCE_HASHKEY, LOADED_TIMESTAMP). The model is designed
      to provide a single record for each product, with the most recent data
      available.
    columns:
      - name: record_hashkey
        description: A unique identifier for each record in the lnd_product model. This
          is generated by hashing the DELTA_RAW_DIFF_KEY from the source data.
        data_type: number
        data_tests:
          - not_null
      - name: source_hashkey
        description: A unique identifier for the source data from which the record in
          the lnd_product model is derived. This is generated by hashing the
          DELTA_RAW_KEY from the source data.
        data_type: number
        data_tests:
          - not_null
      - name: loaded_timestamp
        description: The timestamp indicating when the record was loaded into the
          lnd_product model. This is derived from the DELTA_RAW_TIMESTAMP from
          the source data.
        data_type: timestamp_tz
        data_tests:
          - not_null
      - name: ean_upc
        description: The unique identifier for the product, represented as a decimal
          number. This is derived from the 'ean_upc' field in the source data.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: product_name
        description: The name of the product. This is derived from the 'product_name'
          field in the source data. If the 'product_name' field is null, the '
          product_name' field is used instead.
        data_type: varchar
      - name: gender
        description: The gender for which the product is intended. This is derived from
          the 'gender' field in the source data.
        data_type: varchar
      - name: colour
        description: The 'COLOUR' column represents the color of the product. It is a
          VARCHAR type and can contain any string value representing the color.
        data_type: varchar
      - name: size
        description: The 'SIZE' column represents the size of the product. It is a
          VARCHAR type and can contain any string value representing the size.
        data_type: varchar
      - name: sustainability
        description: The 'SUSTAINABILITY' column indicates whether the product is
          sustainable or not. It is a VARCHAR type and can contain any string
          value representing the sustainability status of the product.
        data_type: varchar
      - name: market
        description: The 'MARKET' column represents the geographical market where the
          product is sold. It is a VARCHAR type and can contain any string value
          representing the market name.
        data_type: varchar
        data_tests:
          - not_null
      - name: department_id
        description: The 'DEPARTMENT_ID' column is a unique identifier for the
          department to which the product belongs. It is a DECIMAL type and can
          contain any numeric value. Each department has a unique ID.
        data_type: number
        data_tests:
          - not_null
      - name: category_id
        description: The 'CATEGORY_ID' column is a unique identifier for the category to
          which the product belongs. It is a DECIMAL type and can contain any
          numeric value. Each category within a department has a unique ID.
        data_type: number
        data_tests:
          - not_null
      - name: sub_category_id
        description: The unique identifier for the sub-category of the product. This is
          a numeric value that is cast from the 'sub_category_id' field in the
          DELTA_RECORD of the source data.
        data_type: number
        data_tests:
          - not_null
      - name: brand_id
        description: The unique identifier for the brand of the product. This is a
          numeric value that is cast from the 'brand_id' field in the
          DELTA_RECORD of the source data.
        data_type: number
        data_tests:
          - not_null
      - name: brand_group_id
        description: The unique identifier for the group to which the brand of the
          product belongs. This is a numeric value that is cast from the
          'brand_group_id' field in the DELTA_RECORD of the source data.
        data_type: number
        data_tests:
          - not_null
  - name: lnd_static_brand_group
    description: The lnd_static_brand_group model is a snapshot of the brand group
      data. It includes columns for the brand group name and ID, as well as
      metadata about the source data and when it was loaded. The model is
      designed to always reflect the most recent snapshot of each brand group,
      as determined by the SNAPSHOT_RAW_TIMESTAMP column.
    columns:
      - name: record_hashkey
        description: This is a unique identifier for each record in the
          lnd_static_brand_group model. It is derived from the
          SNAPSHOT_RAW_DIFF_KEY column in the source table
          RAW_DB.STATIC.SNAPSHOT_BRAND_GROUP.
        data_type: number
        data_tests:
          - not_null
      - name: source_hashkey
        description: This is a unique identifier for the source of each record in the
          lnd_static_brand_group model. It is derived from the SNAPSHOT_RAW_KEY
          column in the source table
          RAW_DB.STATIC.SNAPSHOT_BRAND_GROUP.
        data_type: number
        data_tests:
          - not_null
      - name: loaded_timestamp
        description: This timestamp indicates when the record was loaded into the
          lnd_static_brand_group model. It is derived from the
          SNAPSHOT_RAW_TIMESTAMP column in the source table
          RAW_DB.STATIC.SNAPSHOT_BRAND_GROUP.
        data_type: timestamp_tz
        data_tests:
          - not_null
      - name: brand_group
        description: This column represents the name of the brand group. It is a string
          value that is extracted from the 'brand_group' field of the
          SNAPSHOT_RECORD object in the source data.
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: brand_group_id
        description: This column represents the unique identifier for the brand group.
          It is a decimal value that is extracted from the 'brand_group_id'
          field of the SNAPSHOT_RECORD object in the source data. The ID is
          unique for each brand group and is used for data linking and
          integrity.
        data_type: number
        data_tests:
          - not_null
          - unique
  - name: lnd_store
    description: The lnd_store model is a transformation of the
      RAW_DB.RETAILER.DELTA_STORE source. It contains information
      about different stores, including their ID, name, location (longitude,
      latitude, postcode, city, county, region, country), and tenure. The model
      also includes the retailer group ID associated with each store. The data
      is partitioned by retailer group ID and store ID, and ordered by the
      timestamp of the raw data. Only the most recent record for each partition
      is included in the final model.
    columns:
      - name: record_hashkey
        description: This is a unique identifier for each record in the lnd_store model.
          It is generated from the DELTA_RAW_DIFF_KEY in the source data.
        data_type: number
        data_tests:
          - not_null
      - name: source_hashkey
        description: This is a unique identifier for the source of each record in the
          lnd_store model. It is generated from the DELTA_RAW_KEY in the source
          data.
        data_type: number
        data_tests:
          - not_null
      - name: loaded_timestamp
        description: This timestamp indicates when the record was loaded into the
          lnd_store model. It is generated from the DELTA_RAW_TIMESTAMP in the
          source data.
        data_type: timestamp_tz
        data_tests:
          - not_null
      - name: retailer_group_id
        description: This is a unique identifier for each retailer group. It is a
          numeric value and is used to group different stores under the same
          retailer group.
        data_type: number
        data_tests:
          - not_null
      - name: store_id
        description: This is a unique identifier for each store. It is a string value
          and is used to uniquely identify each store in the database.
        data_type: varchar
      - name: store_key
        description: A unique identifier for each store, generated by concatenating the
          absolute value of the hash of the retailer_id and store_id.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: store_name
        description: This is the name of the store. It is a string value and is used to
          provide a human-readable name for each store.
        data_type: varchar
        data_tests:
          - not_null
      - name: store_longitude
        description: This column represents the longitude coordinate of the store. It is
          a floating point number that indicates the east-west position of the
          store on the Earth's surface.
        data_type: float
      - name: store_latitude
        description: This column represents the latitude coordinate of the store. It is
          a floating point number that indicates the north-south position of the
          store on the Earth's surface.
        data_type: float
      - name: store_tenure
        description: This column represents the tenure of the store. It is a string that
          indicates the duration for which the store has been in operation.
        data_type: varchar
      - name: store_postcode
        description: This column contains the postal code of the store. It is a string
          type and can contain alphanumeric characters.
        data_type: varchar
      - name: store_postcode_area
        description: This column contains the postal code area of the store. It is a
          string type and can contain alphanumeric characters. The postal code
          area is a broader region that includes the specific postal code of the
          store.
        data_type: varchar
      - name: store_city
        description: This column contains the city where the store is located. It is a
          string type and can contain alphanumeric characters.
        data_type: varchar
      - name: store_county
        description: The STORE_COUNTY column represents the county where the store is
          located. It is a VARCHAR type and can contain any alphanumeric
          characters.
        data_type: varchar
      - name: store_region
        description: The STORE_REGION column represents the region where the store is
          located. It is a VARCHAR type and can contain any alphanumeric
          characters.
        data_type: varchar
      - name: store_country
        description: The STORE_COUNTRY column represents the country where the store is
          located. It is a VARCHAR type and can contain any alphanumeric
          characters.
        data_type: varchar
      - name: retailer_id
        description: This column represents the unique identifier for each retailer. It
          is a numeric value that is cast from the 'retailer_id' field in the
          source data.
        data_type: number
        data_tests:
          - not_null
  - name: lnd_transaction
    description: The lnd_transaction model is a comprehensive representation of
      retailer transactions. It includes details such as the retailer group,
      transaction ID, date and time of transaction, channel, store ID, EAN/UPC,
      transaction value, market, quantity, currency, and various product details
      like name, category, sub-category, colour, size, brand, MPN, SKU, and PLU.
      The model is built using the SQL provided, which extracts and transforms
      data from the RAW_DB.RETAILER.DELTA_TRANSACTION source. The
      model also includes RECORD_HASHKEY, SOURCE_HASHKEY, and LOADED_TIMESTAMP
      fields for tracking data lineage and load times.
    columns:
      - name: record_hashkey
        description: This is a unique identifier for each record in the lnd_transaction
          model. It is generated from the DELTA_RAW_DIFF_KEY in the source data.
        data_type: number
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: source_hashkey
        description: This is a unique identifier for the source of each record in the
          lnd_transaction model. It is generated from the DELTA_RAW_KEY in the
          source data.
        data_type: number
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: loaded_timestamp
        description: This is the timestamp when the record was loaded into the
          lnd_transaction model. It is generated from the DELTA_RAW_TIMESTAMP in
          the source data.
        data_type: timestamp_tz
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: retailer_group_id
        description: This is a numeric identifier for the group to which the retailer
          belongs.
        data_type: number
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: retailer
        description: This is a string identifier for the retailer. It is trimmed and
          null values are replaced with the original value in the SQL.
        data_type: varchar
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: transaction_id
        description: This is a string identifier for the transaction. It is cast as a
          varchar in the SQL.
        data_type: varchar
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: transaction_date
        description: This column represents the date of the transaction. The date is
          formatted as 'YYYY-MM-DD'.
        data_type: date
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: transaction_datetime
        description: This column represents the exact date and time of the transaction.
          The datetime is formatted as 'YYYY-MM-DD HH24:MI:SS'.
        data_type: date
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: transaction_channel
        description: This column represents the channel through which the transaction
          was made. It could be online, in-store, etc.
        data_type: varchar
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: transaction_store_id
        description: This column represents the unique identifier of the store where the
          transaction took place. It is a string type field.
        data_type: varchar
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: transaction_ean_upc
        description: This column represents the unique product code associated with the
          product involved in the transaction. It is a string type field.
        data_type: varchar
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: transaction_value
        description: This column represents the monetary value of the transaction. It is
          a numeric field.
        data_type: number
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: transaction_market
        description: This column represents the market in which the transaction took
          place. It is a VARCHAR type and can contain any string value that
          represents a market name.
        data_type: varchar
      - name: transaction_quantity
        description: This column represents the quantity of the product involved in the
          transaction. It is a number type and can contain any numeric value
          that represents the quantity of the product.
        data_type: number
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
      - name: transaction_currency
        description: This column represents the currency used in the transaction. It is
          a VARCHAR type and can contain any string value that represents a
          currency code.
        data_type: varchar
      - name: transaction_product_name
        description: The name of the product involved in the transaction. This is a
          string field and can contain any alphanumeric characters.
        data_type: varchar
      - name: transaction_product_category
        description: The category of the product involved in the transaction. This is a
          string field and can contain any alphanumeric characters. It provides
          a high-level classification of the product.
        data_type: varchar
      - name: transaction_product_sub_category
        description: The sub-category of the product involved in the transaction. This
          is a string field and can contain any alphanumeric characters. It
          provides a more specific classification of the product within its main
          category.
        data_type: varchar
      - name: transaction_product_colour
        description: This column represents the color of the product involved in the
          transaction. It is a string type and can contain any valid color name.
        data_type: varchar
      - name: transaction_product_size
        description: This column represents the size of the product involved in the
          transaction. It is a string type and can contain any valid size
          description.
        data_type: varchar
      - name: transaction_product_brand
        description: This column represents the brand of the product involved in the
          transaction. It is a string type and can contain any valid brand name.
        data_type: varchar
      - name: transaction_product_mpn
        description: This column represents the Manufacturer Part Number (MPN) of the
          product involved in the transaction. It is a unique identifier given
          by the manufacturer to differentiate the product from others in the
          market.
        data_type: varchar
      - name: transaction_product_sku
        description: This column represents the Stock Keeping Unit (SKU) of the product
          involved in the transaction. It is a unique identifier that allows
          retailers to track the inventory levels of the product.
        data_type: varchar
      - name: transaction_product_plu
        description: This column represents the Price Look-Up (PLU) code of the product
          involved in the transaction. It is a unique identifier used by
          retailers to identify the price of the product at the point of sale.
        data_type: varchar
      - name: transaction_concat_key
        data_type: number
        data_tests:
          - not_null:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
          - unique:
              config:
                where: loaded_timestamp >= date_trunc('month', current_timestamp()) AND
                  loaded_timestamp < dateadd(month, 1, date_trunc('month',
                  current_timestamp()))
  - name: lnd_static_brand
    description: The lnd_static_brand model is a transformation of the
      RAW_DB.STATIC.SNAPSHOT_BRAND source. It contains information
      about different brands, including their descriptions, whether they are
      owned brands, and their unique identifiers. The model is designed to only
      keep the most recent record for each brand, as determined by the
      SNAPSHOT_RAW_TIMESTAMP field. The RECORD_HASHKEY and SOURCE_HASHKEY fields
      are derived from the SNAPSHOT_RAW_DIFF_KEY and SNAPSHOT_RAW_KEY fields of
      the source, respectively. The LOADED_TIMESTAMP field indicates the time
      when the record was loaded into the model.
    columns:
      - name: record_hashkey
        description: A unique identifier for each record in the lnd_static_brand model.
          This is derived from the SNAPSHOT_RAW_DIFF_KEY field in the source
          data.
        data_type: number
        data_tests:
          - not_null
      - name: source_hashkey
        description: A unique identifier for the source of each record in the
          lnd_static_brand model. This is derived from the SNAPSHOT_RAW_KEY
          field in the source data.
        data_type: number
        data_tests:
          - not_null
      - name: loaded_timestamp
        description: The timestamp indicating when the record was loaded into the
          lnd_static_brand model. This is derived from the
          SNAPSHOT_RAW_TIMESTAMP field in the source data.
        data_type: timestamp_tz
        data_tests:
          - not_null
      - name: brand_description
        description: This column contains the description of the brand. It is a string
          data type and is extracted from the 'brand_description' field of the
          SNAPSHOT_RECORD in the source data.
        data_type: varchar
        data_tests:
          - not_null
          - unique_case_insensitive
      - name: brand_id
        description: This column contains the unique identifier for each brand. It is a
          numeric data type and is extracted from the 'brand_id' field of the
          SNAPSHOT_RECORD in the source data.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: single_brand
        description: This column represents the unique identifier for each brand. It is
          a VARCHAR type and is derived from the 'single_brand' field in the
          source data.
        data_type: varchar
        data_tests:
          - not_null
  - name: lnd_static_defaults
    description: The lnd_static_defaults model is a transformation of the
      RAW_DB.STATIC.SNAPSHOT_DEFAULTS source table. It contains the
      most recent snapshot of default settings for each user, including their
      default retailer, retailer group, and store. The model is partitioned by
      user and ordered by the snapshot timestamp in descending order to ensure
      the most recent record is selected for each user. The columns in this
      model include RECORD_HASHKEY, SOURCE_HASHKEY, LOADED_TIMESTAMP,
      DEFAULT_USER, DEFAULT_RETAILER, DEFAULT_RETAILER_GROUP, and DEFAULT_STORE.
    columns:
      - name: record_hashkey
        description: This is a unique identifier for each record in the
          lnd_static_defaults model. It is derived from the
          SNAPSHOT_RAW_DIFF_KEY column in the STATIC_DEFAULTS table.
        data_type: number
        data_tests:
          - not_null
      - name: source_hashkey
        description: This is a unique identifier for the source of each record in the
          lnd_static_defaults model. It is derived from the SNAPSHOT_RAW_KEY
          column in the STATIC_DEFAULTS table.
        data_type: number
        data_tests:
          - not_null
      - name: loaded_timestamp
        description: This timestamp indicates when the record was loaded into the
          lnd_static_defaults model. It is derived from the
          SNAPSHOT_RAW_TIMESTAMP column in the STATIC_DEFAULTS table.
        data_type: timestamp_tz
        data_tests:
          - not_null
      - name: default_user
        description: This column represents the default user in the system. It is
          derived from the 'user' field in the source snapshot record and is of
          type VARCHAR.
        data_type: varchar
      - name: default_retailer
        description: This column represents the default retailer associated with the
          user. It is derived from the 'default_retailer' field in the source
          snapshot record and is of type VARCHAR.
        data_type: varchar
      - name: default_retailer_group
        description: This column represents the default retailer group associated with
          the user. It is derived from the 'default_retailer_group' field in the
          source snapshot record and is of type VARCHAR.
        data_type: varchar
      - name: default_store
        description: This column represents the default store associated with a user. It
          is extracted from the 'default_store' field in the SNAPSHOT_RECORD and
          is of type VARCHAR.
        data_type: varchar
  - name: lnd_static_department
    description: 'The lnd_static_department model is a transformation of the
      RAW_DB.STATIC.SNAPSHOT_PRODUCT_DEPARTMENT source. It contains
      a snapshot of the most recent department data, including the product
      department name and department ID. The model is partitioned by department
      ID and ordered by the snapshot timestamp in descending order to ensure the
      most recent data is used. The model includes the following columns:
      RECORD_HASHKEY, SOURCE_HASHKEY, LOADED_TIMESTAMP, PRODUCT_DEPARTMENT, and
      DEPARTMENT_ID.'
    columns:
      - name: record_hashkey
        description: This is a unique identifier for each record in the
          lnd_static_department model. It is derived from the
          SNAPSHOT_RAW_DIFF_KEY column in the source table.
        data_type: number
        data_tests:
          - not_null
      - name: source_hashkey
        description: This is a unique identifier for the source of each record in the
          lnd_static_department model. It is derived from the SNAPSHOT_RAW_KEY
          column in the source table.
        data_type: number
        data_tests:
          - not_null
      - name: loaded_timestamp
        description: This timestamp indicates when the record was loaded into the
          lnd_static_department model. It is derived from the
          SNAPSHOT_RAW_TIMESTAMP column in the source table.
        data_type: timestamp_tz
        data_tests:
          - not_null
      - name: product_department
        description: The PRODUCT_DEPARTMENT column is a VARCHAR type that represents the
          name of the department for a specific product. This data is extracted
          from the 'product_department' field in the SNAPSHOT_RECORD.
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: department_id
        description: The DEPARTMENT_ID column is a DECIMAL type that represents the
          unique identifier for a department. This data is extracted from the
          'department_id' field in the SNAPSHOT_RECORD and is used to partition
          the data in the DEPARTMENT table.
        data_type: number
        data_tests:
          - not_null
          - unique
  - name: lnd_static_market
    description: The lnd_static_market model is a transformation of the
      RAW_DB.STATIC.SNAPSHOT_MARKET source. It contains market data
      with columns for record hashkey, source hashkey, loaded timestamp, market
      id, and market. The model is designed to provide the latest snapshot of
      each market based on the timestamp. The record hashkey and source hashkey
      are unique identifiers for each record and source respectively. The loaded
      timestamp indicates when the data was loaded into the database. The market
      id is a unique identifier for each market and the market column contains
      the name of the market.
    columns:
      - name: record_hashkey
        data_type: number
        data_tests:
          - not_null
      - name: source_hashkey
        data_type: number
        data_tests:
          - not_null
      - name: loaded_timestamp
        data_type: timestamp_tz
        data_tests:
          - not_null
      - name: market_id
        data_type: number
        data_tests:
          - not_null
      - name: market
        data_type: varchar
