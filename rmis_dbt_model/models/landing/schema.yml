  - name: lnd_fx_rates
    description: The lnd_fx_rates model is a transformation of the DELTA_FX_RATES
      table from the RAW_DB.RETAILER source. It includes the most
      recent foreign exchange rate for each date, as well as additional
      information such as whether the date is a weekend and whether the rate is
      a Friday rate. The model is built using a common table expression (CTE)
      that partitions the data by date and orders it by the timestamp, ensuring
      that only the most recent rate for each date is included in the final
      output. The model's columns include keys for the source and record, the
      timestamp of the data load, the date of the rate, the rate itself, and
      flags for weekend and Friday rates.
    columns:
      - name: record_hashkey
        description: This is a unique identifier for each record in the lnd_fx_rates
          model. It is generated by hashing the DELTA_RAW_DIFF_KEY from the
          source data.
        data_type: number
      - name: source_hashkey
        description: This is a unique identifier for the source of each record in the
          lnd_fx_rates model. It is generated by hashing the DELTA_RAW_KEY from
          the source data.
        data_type: number
      - name: loaded_timestamp
        description: This is the timestamp when the record was loaded into the
          lnd_fx_rates model. It is derived from the DELTA_RAW_TIMESTAMP from
          the source data.
        data_type: timestamp_tz
        data_tests:
          - not_null
      - name: fx_date_key
        description: This is a unique identifier for each foreign exchange date. It is
          generated by hashing the date value.
        data_type: number
        data_tests:
          - not_null
      - name: fx_date
        description: This is the date of the foreign exchange rate. It is extracted from
          the DELTA_RECORD['DATE'] field in the source data.
        data_type: date
        data_tests:
          - not_null
          - unique
      - name: is_weekend
        description: A varchar field indicating whether the foreign exchange rate
          corresponds to a weekend. 'True' if it is a weekend, 'False'
          otherwise.
        data_type: varchar
      - name: is_friday_rate
        description: A varchar field indicating whether the foreign exchange rate
          corresponds to a Friday. 'True' if it is a Friday, 'False' otherwise.
        data_type: varchar
      - name: gbp_eur
        description: This column represents the foreign exchange rate from British Pound
          (GBP) to Euro (EUR). The values are of decimal type with a precision
          of 38 and a scale of 4, meaning they can have up to 38 digits in
          total, of which 4 digits can be after the decimal point.
        data_type: number
        tests:
          - not_null
      - name: chf_gbp
        description: This column represents the foreign exchange rate from Swiss Franc
          (CHF) to British Pound (GBP). The values are of decimal type with a
          precision of 38 and a scale of 4.
        data_type: number
        tests:
          - not_null
      - name: usd_gbp
        description: This column represents the foreign exchange rate from US Dollar
          (USD) to British Pound (GBP). The values are of decimal type with a
          precision of 38 and a scale of 4, meaning they can have up to 38
          digits in total, of which 4 digits can be after the decimal point. The
          data for this column is sourced from the 'XUDLUSS' field in the
          DELTA_RECORD of the source data.
        data_type: number
        tests:
          - not_null
      - name: eur_gbp
        description: This column represents the exchange rate from Euro to British
          Pound. The data type is a number with a precision of 38 and a scale of
          4, meaning it can have up to 38 digits in total, of which 4 digits can
          be after the decimal point. The values are derived from the 'XUDLERS'
          field in the source data.
        data_type: number
        tests:
          - not_null
      - name: nok_gbp
        description: This column represents the foreign exchange rate from Norwegian
          Krone (NOK) to British Pound (GBP). The data is of numeric type and is
          derived from the 'XUDLNKS' field in the source data. The value is
          calculated as part of the SQL query in the CTE_FX_RATE common table
          expression.
        data_type: number
        tests:
          - not_null
      - name: chf_eur
        description: This column represents the foreign exchange rate from Swiss Franc
          (CHF) to Euro (EUR). The data type is number and it is extracted from
          the 'CHF/EUR' field in the source data. The values are cast to decimal
          with a precision of 38 and a scale of 4.
        data_type: number
        tests:
          - not_null
      - name: nok_eur
        description: This column represents the foreign exchange rate from Norwegian
          Krone (NOK) to Euro (EUR). The values are of decimal type with a
          precision of 38 and a scale of 4, allowing for accurate representation
          of the exchange rate.
        data_type: number
        tests:
          - not_null
      - name: usd_eur
        description: This column represents the exchange rate from US Dollar (USD) to
          Euro (EUR). The values are of decimal type with a precision of 38 and
          a scale of 4.
        data_type: number
        tests:
          - not_null