# =============================================================================
#  Reporting layer: documentation and not_null / unique tests on the star
#  schema - every dimension key must be present and unique.
# =============================================================================
models:
  - name: dim_brand_group
    description: The dim_brand_group model is a dimension table that contains information about different brand groups. It includes the brand group name, a unique identifier for each brand group, a key associated with the brand group, and the date and time when the data was loaded into the model. The data is sourced from the stg_brand_group table in the dev_STAGING schema of the dev_rmis_db database.
    columns:
      - name: brand_group
        description: The name of the brand group. This is a string field that can contain any alphanumeric characters.
        data_type: varchar
      - name: brand_group_id
        description: The unique identifier for the brand group. This is a numeric field that is automatically generated by the system.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: brand_group_key
        description: The key used to link the brand group to other tables. This is a numeric field that is automatically generated by the system.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: loaded_datetime
        description: This column represents the timestamp when the data was loaded into the 'dim_brand_group' model. It is of 'timestamp_tz' data type, which means it includes both date and time, and is timezone-aware.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: dim_brand
    description: The dim_brand model is a dimension table that contains information about different brands. It includes columns for brand description, brand id, brand key, single brand, and the timestamp when the data was loaded. The data for this model is sourced from the stg_brand table in the dev_STAGING schema of the dev_rmis_db database.
    columns:
      - name: brand_description
        description: This column contains the description of the brand. It is a varchar type and can contain alphanumeric characters.
        data_type: varchar
      - name: brand_id
        description: This column contains the unique identifier for each brand. It is a number type and is unique for each brand.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: brand_key
        description: This column contains the key associated with each brand. It is a number type and is unique for each brand.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: single_brand
        description: This column contains the name of the individual brand. It is a string type field.
        data_type: varchar
      - name: loaded_datetime
        description: This column contains the timestamp of when the data was loaded into the database. It is a timestamp type field.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: dim_department
    description: The dim_department model is a dimension table that contains information about different departments in the organization. It includes the product department, department ID, department key, and the timestamp when the data was loaded into the table. The data is sourced from the stg_department table in the dev_STAGING schema of the dev_rmis_db database.
    columns:
      - name: product_department
        description: The name of the product department. This is a string field that can contain any alphanumeric characters.
        data_type: varchar
      - name: department_id
        description: The unique identifier for each department. This is a numeric field and each department has a unique ID.
        data_type: number
      - name: department_key
        description: The key used to link the department to other tables. This is a numeric field and is unique for each department.
        data_type: number
      - name: loaded_datetime
        description: This column represents the timestamp when the data was loaded into the 'dim_department' model. It is of 'timestamp_tz' data type, which means it includes both date and time, and also accounts for time zone differences.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: dim_product_category
    description: The dim_product_category model is a dimension table that contains information about different product categories. It includes the product category name, a unique identifier for each product category, a key associated with each product category, and the timestamp when the data was loaded into the model. The data is sourced from the stg_product_category table in the dev_STAGING schema of the dev_rmis_db database.
    columns:
      - name: product_category
        description: The name of the product category. This is a string field.
        data_type: varchar
      - name: product_category_id
        description: The unique identifier for the product category. This is a numeric field.
        data_type: number
      - name: product_category_key
        description: The key associated with the product category. This is a numeric field.
        data_type: number
      - name: loaded_datetime
        description: The timestamp indicating when the product category data was loaded into the database. This is in the timezone format.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: dim_product_sub_category
    description: The dim_product_sub_category model is a dimension table that contains information about different product sub-categories. It includes the sub-category name, a unique identifier for each sub-category, a key associated with each sub-category, and the timestamp indicating when the data was loaded into the model. The data is sourced from the stg_product_sub_category table in the dev_STAGING schema of the dev_rmis_db database.
    columns:
      - name: product_sub_category
        description: This column contains the name of the product sub-category.
        data_type: varchar
      - name: sub_category_id
        description: This column contains the unique identifier for each product sub-category.
        data_type: number
      - name: sub_category_key
        description: This column contains the key associated with each product sub-category.
        data_type: number
      - name: loaded_datetime
        description: The timestamp indicating when the data was loaded into the 'dim_product_sub_category' model. This is in the timezone format.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: dim_product
    description: The dim_product model is a dimensional model that contains detailed information about each product. It includes columns for the product's unique identifier (ean_upc), product name, category, sub-category, department, gender, color, size, sustainability, market, brand, and brand group. It also includes metadata about when the record was created and last updated, and by whom.
    columns:
      - name: ean_upc
        data_type: number
        data_tests:
          - not_null
          - unique
        description: This is a numeric field that represents the unique identifier for each product, typically the barcode number.
      - name: ean_upc_key
        data_type: number
        data_tests:
          - not_null
          - unique
        description: This is a numeric field that serves as a unique key for each product's EAN/UPC code.
      - name: product_name
        data_type: varchar
        data_tests:
          - not_null
        description: This is a string field that contains the name of the product.
      - name: product_category_id
        data_type: number
        data_tests:
          - not_null
        description: A unique identifier for the product category. This is a numeric value that is used to categorize products into broad groups.
      - name: product_sub_category_id
        data_type: number
        data_tests:
          - not_null
        description: A unique identifier for the product sub-category. This is a numeric value that is used to further categorize products within a specific product category.
      - name: product_department_id
        data_type: number
        data_tests:
          - not_null
        description: A unique identifier for the product department. This is a numeric value that is used to categorize products into specific departments within the organization.
      - name: product_gender
        data_type: varchar
        description: This column represents the gender for which the product is intended. It is a string type field and can contain values like 'Male', 'Female', 'Unisex', etc.
      - name: product_colour
        data_type: varchar
        description: This column represents the color of the product. It is a string type field and can contain values like 'Red', 'Blue', 'Green', etc.
      - name: product_size
        data_type: varchar
        description: This column represents the size of the product. It is a string type field and can contain values like 'Small', 'Medium', 'Large', etc.
      - name: sustainability
        data_type: varchar
        description: This field indicates whether the product is sustainable or not. It is a varchar type field and can contain values like 'Yes', 'No', or 'Unknown'.
      - name: product_market
        data_type: varchar
        data_tests:
          - not_null
        description: This field represents the market where the product is sold. It is a varchar type field and is converted to uppercase in the SQL query. It can contain values like 'US', 'UK', 'EU', etc.
      - name: brand_id
        data_type: number
        data_tests:
          - not_null
        description: This field is a unique identifier for the brand of the product. It is a number type field and can contain any integer value.
      - name: brand_group_id
        data_type: number
        data_tests:
          - not_null
        description: This is a numeric identifier for the brand group to which the product belongs. It is used to group similar brands together for analysis and reporting purposes.
      - name: loaded_datetime
        data_type: timestamp_tz
        data_tests:
          - not_null
        description: This is a timestamp with timezone that indicates when the product data was loaded into the database. It is used to track data ingestion and updates.
      - name: created_datetime
        data_type: timestamp_ltz
        data_tests:
          - not_null
        description: This is a timestamp with local timezone that indicates when the product record was created in the database. It is used for auditing and tracking the lifecycle of data records.
      - name: created_by
        data_type: varchar
        data_tests:
          - not_null
        description: The username of the user who created the record. This is automatically populated by the CURRENT_USER() function in the SQL.
      - name: last_updated_datetime
        data_type: timestamp_ltz
        data_tests:
          - not_null
        description: The timestamp when the record was last updated. This is automatically populated by the CURRENT_TIMESTAMP() function in the SQL.
      - name: last_updated_by
        data_type: varchar
        data_tests:
          - not_null
        description: The username of the user who last updated the record. This is automatically populated by the CURRENT_USER() function in the SQL.
  - name: dim_retailer
    description: The dim_retailer model is a dimension table that contains information about retailers. It includes details such as the retailer's ID, key, name, group ID, group, segment, size, coverage, transaction mapping, and the datetime when the data was loaded. The data for this model is sourced from the stg_retailer table in the dev_STAGING schema of the dev_rmis_db database.
    columns:
      - name: retailer_id
        description: A unique identifier for each retailer. This is a numeric field.
        data_type: number
        data_tests:
          - unique
          - not_null
      - name: retailer_key
        description: A unique key associated with each retailer. This is also a numeric field.
        data_type: number
      - name: retailer_name
        description: The name of the retailer. This is a string field.
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: retailer_group_id
        description: This is a unique identifier for each retailer group. It is a numeric value and is used to link retailers to their respective groups.
        data_type: varchar
        data_tests:
          - not_null
      - name: retailer_group
        description: This is the name of the retailer group. It is a string value and is used to categorize retailers into different groups based on certain characteristics or attributes.
        data_type: varchar
      - name: retailer_segment
        description: This is the segment to which the retailer belongs. It is a string value and is used to further categorize retailers within a group.
        data_type: varchar
      - name: retailer_size
        description: This column represents the size of the retailer. It is a categorical variable that can take values such as 'small', 'medium', 'large' etc. depending on the size of the retailer.
        data_type: varchar
      - name: retailer_coverage
        description: This column represents the geographical coverage of the retailer. It is a categorical variable that can take values such as 'local', 'regional', 'national', 'international' etc. depending on the geographical coverage of the retailer.
        data_type: varchar
      - name: transaction_mapping
        description: This column represents the mapping of transactions for the retailer. It is a string variable that contains the mapping information for transactions related to the retailer.
        data_type: varchar
        data_tests:
          - not_null
      - name: loaded_datetime
        description: This column represents the timestamp when the data was loaded into the 'dim_retailer' model. The data type is timestamp_tz, which includes both date and time, along with the timezone information.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: dim_sales_channel
    description: The dim_sales_channel model is a dimension table that contains information about different sales channels. It includes unique identifiers for each sales channel, the name of the sales channel, the group it belongs to, and a mapping for transactions. The data is loaded from the stg_sales_channel staging table in the dev_rmis_db database.
    columns:
      - name: sales_channel_id
        description: A unique identifier for each sales channel. This is a numeric field.
        data_type: number
        data_tests:
          - not_null
      - name: sales_mapping_key
        description: A unique key associated with each sales channel. This is a numeric field.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: sales_channel
        description: The name of the sales channel. This is a string field.
        data_type: varchar
      - name: sales_channel_group
        description: This column represents the group to which the sales channel belongs. It is a string data type and can contain any alphanumeric characters.
        data_type: varchar
      - name: transaction_mapping
        description: This column represents the mapping of transactions for the sales channel. It is a string data type and can contain any alphanumeric characters.
        data_type: varchar
        data_tests:
          - not_null
      - name: loaded_datetime
        description: This column represents the timestamp when the data was loaded into the database. It is a timestamp with timezone data type.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: dim_store
    description: The dim_store model is a dimension table that contains information about different stores. It includes details such as the store's ID, key, retailer ID, name, postcode, postcode area, tenure, city, county, region, country, latitude, longitude, retailer group ID, and the datetime when the data was loaded into the model.
    columns:
      - name: store_id
        description: The unique identifier for each store. This is a varchar field and is the primary key for the dim_store model.
        data_type: varchar
      - name: store_key
        description: A unique key for each store. This is a varchar field and is used for joining with other tables.
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: retailer_id
        description: The unique identifier for the retailer that owns the store. This is a number field and is used for joining with the retailer table.
        data_type: number
      - name: store_name
        description: The name of the store. This is a string field and can contain alphanumeric characters.
        data_type: varchar
      - name: store_postcode
        description: The postal code of the store. This is a string field and can contain alphanumeric characters. It represents the specific postal area where the store is located.
        data_type: varchar
      - name: store_postcode_area
        description: The postal code area of the store. This is a string field and can contain alphanumeric characters. It represents the broader area within which the specific postal code of the store falls.
        data_type: varchar
      - name: store_tenure
        description: The tenure of the store, indicating how long the store has been in operation. This is a string field.
        data_type: varchar
      - name: store_city
        description: The city where the store is located. This is a string field.
        data_type: varchar
      - name: store_county
        description: The county where the store is located. This is a string field.
        data_type: varchar
      - name: store_region
        description: The region where the store is located. This is a string value that can be used to group stores by region for regional analysis.
        data_type: varchar
      - name: store_country
        description: The country where the store is located. This is a string value that can be used to group stores by country for country-level analysis.
        data_type: varchar
      - name: store_latitude
        description: The latitude coordinate of the store's location. This is a float value that can be used in conjunction with the store's longitude to pinpoint its exact geographical location.
        data_type: float
      - name: store_longitude
        description: This column represents the longitude coordinate of the store location. It is a floating point number that indicates the east-west position of a point on the Earth's surface.
        data_type: float
      - name: retailer_group_id
        description: This column represents the unique identifier for the retailer group that the store belongs to. It is a numeric value that is used to group stores that are part of the same retailer group.
        data_type: number
      - name: loaded_datetime
        description: This column represents the timestamp when the data was loaded into the database. It is a timestamp with timezone data type that indicates the date and time when the data was loaded.
        data_type: timestamp_tz
        data_tests:
          - not_null
  - name: fct_transaction
    description: The fct_transaction model is a fact table that contains transactional data. It includes information about the transaction such as the date, channel, value, market, quantity, and currency. It also includes details about the product involved in the transaction, such as the product category, sub-category, department, brand, and EAN/UPC key. Retailer information is also included, such as the retailer name, group, and ID. The model also contains information about the sales channel and store. The data is sourced from the dim_product, dim_retailer, dim_sales_channel, and stg_transaction tables. The model is designed to provide a comprehensive view of each transaction for reporting and analysis purposes.
    columns:
      - name: loaded_datetime
        data_type: timestamp_tz
        data_tests:
          - not_null
        description: This column represents the timestamp when the transaction data was loaded into the database. It is of type timestamp_tz.
      - name: transaction_id
        data_type: varchar
        data_tests:
          - not_null
        description: This column represents the unique identifier for each transaction. It is of type varchar.
      - name: transaction_date
        data_type: date
        data_tests:
          - not_null
        description: This column represents the date when the transaction occurred. It is of type date.
      - name: transaction_channel
        data_type: varchar
        description: This column represents the channel through which the transaction was made. It is a string data type and can include values such as 'online', 'in-store', etc.
        data_tests:
          - not_null
      - name: transaction_ean_upc
        data_type: varchar
        data_tests:
          - not_null
        description: This column represents the EAN/UPC code of the product involved in the transaction. EAN stands for European Article Number, and UPC stands for Universal Product Code. Both are barcodes used to track products. It is a string data type.
      - name: transaction_ean_upc_key
        data_type: number
        data_tests:
          - not_null
        description: This column represents a unique identifier for the EAN/UPC code of the product involved in the transaction. It is a numeric data type.
      - name: transaction_concat_key
        data_type: number
        data_tests:
          - not_null
          - unique
        description: A unique identifier for each transaction, created by concatenating multiple transaction-related fields.
      - name: transaction_value
        data_type: number
        data_tests:
          - not_null
        description: The monetary value of the transaction. This value is in the currency specified by the 'transaction_currency' field.
      - name: transaction_market
        data_type: varchar
        description: The market in which the transaction took place. This is typically classed as OUTDOOR.
      - name: transaction_quantity
        data_type: number
        data_tests:
          - not_null
        description: The quantity of items involved in the transaction. This is a numeric field.
      - name: transaction_currency
        data_type: varchar
        description: The currency in which the transaction was made. This is a string field that typically contains standard currency codes like 'USD', 'EUR', etc.
      - name: retailer_group_id
        data_type: number
        data_tests:
          - not_null
        description: The unique identifier for the group to which the retailer belongs. This is a numeric field.
      - name: product_category_id
        data_type: number
        data_tests:
          - not_null
        description: This column contains the ID of the product category. It is a numeric data type and is used to categorize the products into different groups for better analysis and understanding.
      - name: product_department_id
        data_type: number
        description: This is a numeric identifier for the department to which the product belongs. It is derived from the 'dim_product' table in the 'dev_REPORTING' database. If the product department ID is not available, it is replaced with -1.
        data_tests:
          - not_null
      - name: brand_id
        data_type: number
        description: This is a numeric identifier for the brand of the product. It is derived from the 'dim_product' table in the 'dev_REPORTING' database. If the brand ID is not available, it is replaced with -1.
        data_tests:
          - not_null
      - name: brand_group_id
        data_type: number
        description: This is a numeric identifier for the group to which the brand of the product belongs. It is derived from the 'dim_product' table in the 'dev_REPORTING' database. If the brand group ID is not available, it is replaced with -1.
        data_tests:
          - not_null
      - name: product_ean_upc_key
        data_type: number
        description: This is a unique identifier for each product, derived from the EAN/UPC code of the product. It is used to join the transaction data with the product dimension table.
        data_tests:
          - not_null
      - name: retailer_id
        data_type: number
        description: This is a unique identifier for each retailer. It is used to join the transaction data with the retailer dimension table. If the retailer is not found in the retailer dimension table, the value is set to -1.
        data_tests:
          - not_null
      - name: transaction_store_key
        data_type: varchar
        description: This is a unique identifier for each store. It is a concatenation of the transaction_store_id and the retailer_id. If the transaction_store_id is not found, the value is set to '-1'.
        data_tests:
          - not_null
      - name: sales_channel_id
        data_type: number
        description: The unique identifier for the sales channel. This is a numeric value that is used to identify the specific channel through which the transaction was made.
        data_tests:
          - not_null
      - name: original_store_id
        data_type: varchar
        description: The original identifier for the store where the transaction took place. This is a string value that represents the original ID of the store before any transformations or mappings were applied.
      - name: retailer_id_key
        data_type: number
        description: The unique key for the retailer. This is a numeric value that is used to uniquely identify the retailer who made the transaction. This key is generated by hashing the retailer name.
        data_tests:
          - not_null
      - name: sales_mapping_key
        data_type: number
        description: This is a unique identifier for the sales channel mapping. It is derived from the 'dim_sales_channel' table in the 'dev_REPORTING' database. The key is generated by hashing the transaction mapping of the sales channel.
        data_tests:
          - not_null
      - name: row_no
        data_type: number
        description: This is a row number that is generated for each row in the 'cte_fact' table. The row number is partitioned by the 'transaction_concat_key' and ordered by the 'loaded_datetime' in descending order. This helps in identifying the most recent transaction for each 'transaction_concat_key'.
      - name: product_sub_category_id
        description: This column contains the ID of the product sub-category. It is a numeric data type and is used to further categorize the products within a category for more detailed analysis.
        data_type: number
        data_tests:
          - not_null
  - name: dim_fx_rates
    description: "The 'dim_fx_rates' model is a dimension table that contains foreign exchange rates. It is derived from the 'stg_fx_rates' staging table in the 'dev_rmis_db' database. The model includes the following columns: 'LOADED_TIMESTAMP', 'FX_DATE_KEY', 'FX_DATE', and 'FX_RATE'. 'LOADED_TIMESTAMP' indicates the time when the data was loaded into the database. 'FX_DATE_KEY' is a unique identifier for each foreign exchange rate entry. 'FX_DATE' represents the date of the foreign exchange rate. 'FX_RATE' is the actual foreign exchange rate."
    columns:
      - name: loaded_datetime
        description: The timestamp when the foreign exchange rate was loaded into the database. This is in timestamp with timezone format.
        data_type: timestamp_tz
        data_tests:
          - not_null
      - name: fx_date_key
        description: A unique identifier for each foreign exchange rate record. This is a numeric value.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: fx_date
        description: The date when the foreign exchange rate is applicable. This is in date format.
        data_type: date
        data_tests:
          - not_null
          - unique