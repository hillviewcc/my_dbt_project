# =============================================================================
#  dbt project: RMIS - Retail Market Intelligence System
#
#  Builds a Snowflake star schema of retail sales from many retailers, then
#  publishes BI-ready datasets for market-share, brand-share and retailer-share
#  dashboards.
#
#  Layers (folders under rmis_dbt_model/models):
#    landing/                 views  - parse raw JSON feeds, de-duplicate, clean
#    staging/                 tables - typed, keyed, incremental; gap-filling
#    u-reporting/             tables - dimensions (dim_*) and facts (fct_*)
#    z-quicksight_reporting/  tables - pre-aggregated datasets for dashboards
#    date/                    table  - generated calendar dimension
# =============================================================================
name: 'rmis_dbt_model'
version: '1.0.0'

# -----------------------------------------------------------------------------
# Hooks that run once at the start of every dbt invocation:
# log which target / warehouse is in use, then switch to that warehouse.
# -----------------------------------------------------------------------------
on-run-start:
  - "{{ log('target.name=' ~ target.name ~ ' | target.warehouse=' ~ target.warehouse, info=True) }}"
  - "{{ log('RMIS_SNOWFLAKE_WAREHOUSE=' ~ env_var('RMIS_SNOWFLAKE_WAREHOUSE','<unset>'), info=True) }}"
  - "USE WAREHOUSE {{ target.warehouse }};"

# Access provisioning belongs to infrastructure administration, not model runs.
# The optional reporting_reader grants below are read-only and target-scoped.
# Enable explicitly with --vars '{grant_reporting_access: true}' after the role
# has been provisioned and the executing role has the required grant privileges.
on-run-end:
  - "{{ grant_reporting_read_access() }}"

# Connection profile to use (defined in .dbt/profiles.yml).
profile: 'rmis_dbt_model'

# Where dbt finds each type of file. Everything lives under rmis_dbt_model/.
model-paths: ["rmis_dbt_model/models"]
analysis-paths: ["rmis_dbt_model/analyses"]
test-paths: ["rmis_dbt_model/tests"]
seed-paths: ["rmis_dbt_model/seeds"]
macro-paths: ["rmis_dbt_model/macros"]
snapshot-paths: ["rmis_dbt_model/snapshots"]

clean-targets:         # directories removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Database names, overridable from the command line with --vars.
vars:
  grant_reporting_access: false
  dev_db: dev_rmis_db                       # every layer builds here in dev
  prod_db: prod_rmis_db                     # landing + staging in prod
  prod_reporting_db: prod_rmis_reporting_db # reporting layers in prod

# -----------------------------------------------------------------------------
# Folder-level model configuration ('+' = applies to every model in the folder;
# a model can still override it with its own config() block).
#
# Environment switching: in prod, landing/staging and the reporting layers are
# split across two databases; in dev everything goes to one dev database.
# -----------------------------------------------------------------------------
models:
  rmis_dbt_model:
    +static_analysis: strict    # dbt Fusion: full SQL compile-time checking

    landing:
      +database: "{{ var('prod_db', 'prod_rmis_db') if target.name == 'prod' else var('dev_db', 'dev_rmis_db') }}"
      +schema: "LANDING"
      +materialized: view       # always reflects the latest raw data, no storage cost

    staging:
      +database: "{{ var('prod_db', 'prod_rmis_db') if target.name == 'prod' else var('dev_db', 'dev_rmis_db') }}"
      +schema: "STAGING"
      +materialized: table      # most staging models override this to incremental

    u-reporting:
      +database: "{{ var('prod_reporting_db', 'prod_rmis_reporting_db') if target.name == 'prod' else var('dev_db', 'dev_rmis_db') }}"
      +schema: "REPORTING"
      +materialized: table

    z-quicksight_reporting:
      +database: "{{ var('prod_reporting_db', 'prod_rmis_reporting_db') if target.name == 'prod' else var('dev_db', 'dev_rmis_db') }}"
      +schema: "REPORTING"
      +materialized: table      # rebuilt in full each run so dashboards read a consistent snapshot

    date:
      +database: "{{ var('prod_reporting_db', 'prod_rmis_reporting_db') if target.name == 'prod' else var('dev_db', 'dev_rmis_db') }}"
      +schema: "DATE"
      +materialized: table
